name: Moodle Plugin CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-analysis:
    name: Static analysis (Moodle 5.2 / PHP 8.4 / PostgreSQL)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out plugin
        uses: actions/checkout@v6
        with:
          path: plugin
          persist-credentials: false

      - name: Resolve plugin path
        shell: bash
        run: |
          if [[ -f "plugin/version.php" ]]; then
            echo "PLUGIN_PATH=./plugin" >> "$GITHUB_ENV"
          elif [[ -f "plugin/coursecompliance/version.php" ]]; then
            echo "PLUGIN_PATH=./plugin/coursecompliance" >> "$GITHUB_ENV"
          else
            echo "Cannot find tool_coursecompliance version.php" >&2
            find plugin -maxdepth 3 -type f | sort | head -100
            exit 1
          fi

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pgsql, mysqli, zip, gd, soap, intl, sodium
          ini-values: max_input_vars=5000, opcache.enable_cli=1, opcache.jit=disable
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4.5.11
          echo "$(cd ci/bin; pwd)" >> "$GITHUB_PATH"
          echo "$(cd ci/vendor/bin; pwd)" >> "$GITHUB_PATH"
          echo "NVM_DIR=$HOME/.nvm" >> "$GITHUB_ENV"
          sudo locale-gen en_AU.UTF-8

      - name: Install Moodle 5.2 test site
        run: moodle-plugin-ci install --plugin "$PLUGIN_PATH" --db-host=127.0.0.1 --no-plugin-node
        env:
          DB: pgsql
          DB_USER: postgres
          MOODLE_BRANCH: MOODLE_502_STABLE

      - name: PHP lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint "$PLUGIN_PATH"

      - name: Moodle CodeSniffer
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0 "$PLUGIN_PATH"

      - name: Validate plugin
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate --moodle ./moodle "$PLUGIN_PATH"

      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints "$PLUGIN_PATH"

      - name: PHPDoc checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --moodle ./moodle --max-warnings 0 "$PLUGIN_PATH"

      - name: Mustache lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci mustache --moodle ./moodle "$PLUGIN_PATH"

      - name: Grunt / AMD JavaScript
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail

          # Moodle 5.1+ moved plugins below public/. Moodle 5.0 keeps the old layout.
          if [[ -d "./moodle/public/admin/tool/coursecompliance" ]]; then
            MOODLE_PLUGIN_ROOT="public/admin/tool/coursecompliance"
          elif [[ -d "./moodle/admin/tool/coursecompliance" ]]; then
            MOODLE_PLUGIN_ROOT="admin/tool/coursecompliance"
          else
            echo "Installed tool_coursecompliance directory was not found" >&2
            find ./moodle -type d -path '*/admin/tool/coursecompliance' -print || true
            exit 1
          fi

          # Run Moodle's own Grunt from the directory that contains Gruntfile.js.
          # Do not use `moodle-plugin-ci grunt` here: with a checkout supplied as an
          # explicit plugin path it can try to back up/restore the repository .git
          # directory and fail with permissions errors.
          source "$NVM_DIR/nvm.sh"
          cd ./moodle
          nvm use
          npx grunt amd --root="$MOODLE_PLUGIN_ROOT"

      - name: PHPUnit
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --moodle ./moodle --fail-on-warning "$PLUGIN_PATH"

  compatibility:
    name: ${{ matrix.moodle-branch }} / PHP ${{ matrix.php }} / ${{ matrix.database }}
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    strategy:
      fail-fast: false
      matrix:
        include:
          - moodle-branch: MOODLE_500_STABLE
            php: '8.2'
            database: pgsql
            dbuser: postgres
          - moodle-branch: MOODLE_500_STABLE
            php: '8.4'
            database: pgsql
            dbuser: postgres
          - moodle-branch: MOODLE_501_STABLE
            php: '8.2'
            database: pgsql
            dbuser: postgres
          - moodle-branch: MOODLE_501_STABLE
            php: '8.4'
            database: pgsql
            dbuser: postgres
          - moodle-branch: MOODLE_502_STABLE
            php: '8.3'
            database: pgsql
            dbuser: postgres
          - moodle-branch: MOODLE_502_STABLE
            php: '8.4'
            database: pgsql
            dbuser: postgres
          - moodle-branch: MOODLE_500_STABLE
            php: '8.4'
            database: mysqli
            dbuser: root
          - moodle-branch: MOODLE_501_STABLE
            php: '8.4'
            database: mysqli
            dbuser: root
          - moodle-branch: MOODLE_502_STABLE
            php: '8.4'
            database: mysqli
            dbuser: root
    steps:
      - name: Check out plugin
        uses: actions/checkout@v6
        with:
          path: plugin
          persist-credentials: false

      - name: Resolve plugin path
        shell: bash
        run: |
          if [[ -f "plugin/version.php" ]]; then
            echo "PLUGIN_PATH=./plugin" >> "$GITHUB_ENV"
          elif [[ -f "plugin/coursecompliance/version.php" ]]; then
            echo "PLUGIN_PATH=./plugin/coursecompliance" >> "$GITHUB_ENV"
          else
            echo "Cannot find tool_coursecompliance version.php" >&2
            exit 1
          fi

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pgsql, mysqli, zip, gd, soap, intl, sodium
          ini-values: max_input_vars=5000, opcache.enable_cli=1, opcache.jit=disable
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4.5.11
          echo "$(cd ci/bin; pwd)" >> "$GITHUB_PATH"
          echo "$(cd ci/vendor/bin; pwd)" >> "$GITHUB_PATH"
          echo "NVM_DIR=$HOME/.nvm" >> "$GITHUB_ENV"
          sudo locale-gen en_AU.UTF-8

      - name: Install Moodle compatibility site
        run: >-
          moodle-plugin-ci install
          --plugin "$PLUGIN_PATH"
          --db-host=127.0.0.1
          --db-user="${{ matrix.dbuser }}"
          --db-pass=""
          --no-plugin-node
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: PHPUnit compatibility suite
        run: moodle-plugin-ci phpunit --moodle ./moodle --fail-on-warning "$PLUGIN_PATH"

  package-check:
    name: Release package structure
    runs-on: ubuntu-24.04
    steps:
      - name: Check out plugin
        uses: actions/checkout@v6
        with:
          path: repo
          persist-credentials: false

      - name: Build and validate distributable ZIP
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f "repo/version.php" ]]; then
            SOURCE_DIR="repo"
          elif [[ -f "repo/coursecompliance/version.php" ]]; then
            SOURCE_DIR="repo/coursecompliance"
          else
            echo "Cannot find tool_coursecompliance version.php" >&2
            exit 1
          fi

          rm -rf staging release
          mkdir -p staging/coursecompliance release
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            "$SOURCE_DIR/" staging/coursecompliance/
          (cd staging && zip -qr ../release/tool_coursecompliance.zip coursecompliance)
          unzip -t release/tool_coursecompliance.zip

          python - <<'PY'
          import zipfile

          path = 'release/tool_coursecompliance.zip'
          required = {
              'coursecompliance/version.php',
              'coursecompliance/README.md',
              'coursecompliance/LICENSE',
              'coursecompliance/db/install.xml',
          }
          with zipfile.ZipFile(path) as archive:
              names = set(archive.namelist())
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f'Missing required release files: {missing}')
          invalid = [
              name for name in names
              if not name.startswith('coursecompliance/')
              or '/.git/' in name
              or '/.github/' in name
          ]
          if invalid:
              raise SystemExit(f'Invalid release paths: {invalid[:20]}')
          print(f'Release package contains {len(names)} paths under coursecompliance/.')
          PY

  required-checks:
    name: Required checks
    if: ${{ always() }}
    needs:
      - static-analysis
      - compatibility
      - package-check
    runs-on: ubuntu-24.04
    steps:
      - name: Verify all CI jobs passed
        run: |
          [[ "${{ needs.static-analysis.result }}" == "success" ]]
          [[ "${{ needs.compatibility.result }}" == "success" ]]
          [[ "${{ needs.package-check.result }}" == "success" ]]

  release-package:
    name: Build release package
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs:
      - required-checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out plugin
        uses: actions/checkout@v6
        with:
          path: repo
          persist-credentials: false

      - name: Build Moodle plugin ZIP
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f "repo/version.php" ]]; then
            SOURCE_DIR="repo"
          elif [[ -f "repo/coursecompliance/version.php" ]]; then
            SOURCE_DIR="repo/coursecompliance"
          else
            echo "Cannot find tool_coursecompliance version.php" >&2
            exit 1
          fi

          RELEASE=$(python - "$SOURCE_DIR/version.php" <<'PY'
          import re
          import sys
          text = open(sys.argv[1], encoding='utf-8').read()
          match = re.search(r"\$plugin->release\s*=\s*'([^']+)'", text)
          if not match:
              raise SystemExit('Could not read $plugin->release from version.php')
          print(match.group(1))
          PY
          )
          if [[ "v${RELEASE}" != "$GITHUB_REF_NAME" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match plugin release v${RELEASE}" >&2
            exit 1
          fi

          rm -rf staging release
          mkdir -p staging/coursecompliance release
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            "$SOURCE_DIR/" staging/coursecompliance/
          (cd staging && zip -qr "../release/tool_coursecompliance-${GITHUB_REF_NAME}.zip" coursecompliance)
          unzip -t "release/tool_coursecompliance-${GITHUB_REF_NAME}.zip"

      - name: Upload release package
        uses: actions/upload-artifact@v7
        with:
          name: tool_coursecompliance-${{ github.ref_name }}
          path: release/*.zip
          retention-days: 30
