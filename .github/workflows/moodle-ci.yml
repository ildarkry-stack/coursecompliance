name: Moodle Plugin CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Moodle ${{ matrix.moodle }} / PHP ${{ matrix.php }} / ${{ matrix.database }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {moodle: "5.0", branch: MOODLE_500_STABLE, php: "8.2", database: pgsql}
          - {moodle: "5.1", branch: MOODLE_501_STABLE, php: "8.2", database: pgsql}
          - {moodle: "5.2", branch: MOODLE_502_STABLE, php: "8.3", database: pgsql}
          - {moodle: "5.2", branch: MOODLE_502_STABLE, php: "8.4", database: mysqli}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: moodle
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v6
        with:
          path: plugin
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pgsql, mysqli, zip, gd, soap, intl, sodium
          coverage: none

      - name: Install moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo "$(cd ci/bin && pwd)" >> "$GITHUB_PATH"
          echo "$(cd ci/vendor/bin && pwd)" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8

      - name: Clean install
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.branch }}

      - name: PHP lint
        run: moodle-plugin-ci phplint "$GITHUB_WORKSPACE/plugin"

      - name: Moodle coding style
        run: moodle-plugin-ci phpcs --max-warnings 0 "$GITHUB_WORKSPACE/plugin"

      - name: Plugin validation
        run: moodle-plugin-ci validate --moodle ./moodle "$GITHUB_WORKSPACE/plugin"

      - name: Upgrade savepoints
        run: moodle-plugin-ci savepoints "$GITHUB_WORKSPACE/plugin"

      - name: PHPDoc
        run: moodle-plugin-ci phpdoc --moodle ./moodle --max-warnings 0 "$GITHUB_WORKSPACE/plugin"

      - name: PHPUnit
        run: moodle-plugin-ci phpunit --moodle ./moodle --fail-on-warning "$GITHUB_WORKSPACE/plugin"
