name: Feature request
description: Suggest a CourseCompliance workflow or audit improvement.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Administration problem
      description: What repetitive or risky Moodle administration task are you trying to improve?
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Desired workflow
      description: Describe what the administrator should be able to do and what result should be produced.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety constraints
      description: Note anything that must remain read-only, require preview/approval, or avoid guessing automatically.
  - type: dropdown
    id: scope
    attributes:
      label: Typical scale
      options:
        - One course
        - 2–20 courses
        - 21–100 courses
        - 101–500 courses
        - More than 500 courses
        - Not sure
